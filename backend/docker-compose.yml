version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: listingsai
      POSTGRES_PASSWORD: listingsai
      POSTGRES_DB: listingsai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
volumes:
  pgdata:
